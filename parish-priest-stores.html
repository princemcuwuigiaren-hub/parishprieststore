<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parish Priest Stores</title>
<meta name="theme-color" content="#16223F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PP Stores">
<meta name="description" content="Parish Priest Stores, genuine phones, gadgets and accessories, delivered across Nigeria.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#16223F; --navy-deep:#0E1730; --navy-soft:#22335C; --navy-tint:#EEF0F7;
  --gold:#E8A33D; --gold-deep:#C9820A; --gold-soft:#FBEDD3;
  --green:#2F9E64; --green-soft:#E7F5EC;
  --red:#D6534A; --red-soft:#FBEAE9;
  --bg:#FAFAF7; --surface:#FFFFFF;
  --ink:#14172A; --ink-soft:#5B6072; --ink-faint:#9498A6;
  --border:#EAE7E0; --border-soft:#F1EFE8;
  --radius-s:10px; --radius-m:14px; --radius-l:20px;
  --shadow: 0 1px 2px rgba(20,23,42,.05), 0 4px 14px rgba(20,23,42,.06);
  --shadow-lg: 0 12px 32px rgba(14,23,48,.16), 0 2px 8px rgba(14,23,48,.08);
  --nav-h:68px; --bar-h:56px; --nav-buffer:16px;
  --font-display:"Sora",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --fs-2xs:10px; --fs-xs:11px; --fs-sm:12.5px; --fs-base:14px; --fs-md:16px; --fs-lg:19px; --fs-xl:23px; --fs-display:28px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; -webkit-touch-callout:none; user-select:none;}
input, textarea, select{-webkit-user-select:text; -webkit-touch-callout:default; user-select:text;}
html,body{margin:0; padding:0; height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--ink);
  padding-bottom:calc(var(--nav-h) + var(--nav-buffer) + env(safe-area-inset-bottom));
  overscroll-behavior-y:none;
}
button{font-family:var(--font-display); cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}
.eyebrow{
  font-size:11px; font-weight:700; letter-spacing:.11em; text-transform:uppercase;
  color:var(--gold-deep); font-family:var(--font-display);
}
h1,h2,h3{margin:0; letter-spacing:-0.01em; font-weight:800; font-family:var(--font-display);}
.brand-name{font-family:var(--font-display);}
.pd-price, .pd-title, .confirm-code{font-family:var(--font-display);}

/* ---------- Top bar ---------- */
.topbar{
  position:fixed; top:0; left:0; right:0; z-index:40;
  background:var(--navy); color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 16px 12px;
  box-shadow:0 6px 20px rgba(14,23,48,.16);
}
.topbar-row{display:flex; align-items:center; gap:10px;}
.brand{display:flex; align-items:center; gap:9px; flex:1; min-width:0;}
.brand-mark{
  width:34px; height:34px; border-radius:9px; flex:none;
  background:linear-gradient(155deg,var(--gold) 0%,var(--gold-deep) 100%);
  display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:15px; color:var(--navy-deep);
}
.brand-name{font-size:15px; font-weight:800; letter-spacing:-.01em; line-height:1.15;}
.brand-name small{display:block; font-size:9.5px; font-weight:700; letter-spacing:.14em; color:var(--gold); text-transform:uppercase; margin-top:1px;}
.icon-btn{
  width:38px; height:38px; border-radius:10px; border:none;
  background:rgba(255,255,255,.09); color:#fff; display:flex; align-items:center; justify-content:center;
  flex:none; position:relative;
}
.icon-btn svg{width:19px; height:19px;}
.badge-dot{
  position:absolute; top:-3px; right:-3px; min-width:16px; height:16px; padding:0 3px;
  border-radius:8px; background:var(--gold); color:var(--navy-deep);
  font-size:9.5px; font-weight:800; display:flex; align-items:center; justify-content:center;
}
.searchbar{
  margin-top:11px; display:flex; align-items:center; gap:8px;
  background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.14);
  border-radius:11px; padding:10px 12px;
}
.searchbar svg{width:16px; height:16px; opacity:.7; flex:none;}
.searchbar input{
  flex:1; border:none; background:none; outline:none; color:#fff; font-size:14px;
  font-family:var(--font-display); font-weight:600; letter-spacing:-.01em;
}
.searchbar input::placeholder{color:rgba(255,255,255,.6); font-weight:600;}

/* ---------- Page header (non-home views) ---------- */
.page-head{
  display:flex; align-items:center; gap:10px; padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  background:var(--navy); color:#fff; position:fixed; top:0; left:0; right:0; z-index:40;
  box-shadow:0 6px 20px rgba(14,23,48,.16);
}
.page-head h1{font-size:17px;}
.back-btn{width:34px; height:34px; border-radius:9px; border:none; background:rgba(255,255,255,.09); color:#fff; display:flex; align-items:center; justify-content:center;}
.back-btn svg{width:18px; height:18px;}

main{max-width:640px; margin:0 auto; padding-top:110px;}
section.view{display:none; padding:16px;}
section.view.active{display:block; animation:viewIn .22s ease;}
@keyframes viewIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

/* ---------- Promo banner ---------- */
.promo{
  position:relative; overflow:hidden; border-radius:var(--radius-l); padding:22px 18px;
  background:linear-gradient(120deg,var(--navy-deep) 0%,var(--navy) 55%,var(--navy-soft) 100%);
  color:#fff; margin-bottom:24px; box-shadow:var(--shadow-lg);
  display:flex; align-items:center; gap:16px; min-height:96px;
}
.promo::after{
  content:""; position:absolute; inset:0; opacity:.14; pointer-events:none;
  background-image: radial-gradient(circle,#fff 1px, transparent 1.4px);
  background-size:14px 14px; background-position:-4px -4px;
  mask-image:linear-gradient(120deg, transparent 0%, #000 60%);
}
.promo-content{position:relative; flex:1; min-width:0;}
.promo-eyebrow{font-size:var(--fs-xs); font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--gold);}
.promo h2{font-size:var(--fs-xl); margin-top:7px; line-height:1.28;}
.promo p{font-size:var(--fs-sm); color:rgba(255,255,255,.72); margin:7px 0 14px; line-height:1.5;}
.promo-cta{
  display:inline-flex; align-items:center; gap:6px;
  background:var(--gold); color:var(--navy-deep); border:none; border-radius:var(--radius-s);
  padding:9px 15px; font-size:var(--fs-sm); font-weight:800;
}
.promo-badge{
  position:relative; flex:none; width:84px; height:84px; border-radius:20px;
  background:var(--gold); color:var(--navy-deep); transform:rotate(-6deg);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  box-shadow:0 12px 26px rgba(232,163,61,.4);
}
.promo-badge::after{
  content:""; position:absolute; inset:-6px; border-radius:24px;
  border:1.5px dashed rgba(255,255,255,.5); transform:rotate(4deg);
}
.promo-badge strong{font-family:var(--font-display); font-size:24px; font-weight:800; line-height:1;}
.promo-badge span{font-family:var(--font-display); font-size:9.5px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; margin-top:2px;}

/* ---------- Section headers ---------- */
.sec-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px;}
.sec-head h3{font-size:16px;}
.sec-link{font-size:12px; font-weight:700; color:var(--navy); background:none; border:none; display:flex; align-items:center; gap:3px;}
.sec-link svg{width:13px; height:13px;}
.hscroll{display:flex; gap:12px; overflow-x:auto; padding-bottom:4px; margin:0 -16px 26px; padding-left:16px; padding-right:16px; scroll-snap-type:x proximity;}
.hscroll::-webkit-scrollbar{display:none;}

/* ---------- Category chips / grid ---------- */
.cat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:11px; margin-bottom:26px;}
.cat-grid.full{grid-template-columns:repeat(3,1fr);}
.cat-item{
  display:flex; flex-direction:column; align-items:center; gap:8px;
  background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-m); padding:16px 6px;
  text-align:center; box-shadow:var(--shadow);
}
.cat-icon{
  width:48px; height:48px; border-radius:13px; background:var(--navy-tint);
  display:flex; align-items:center; justify-content:center; color:var(--navy);
}
.cat-icon svg{width:23px; height:23px;}
.cat-item span{font-size:11.5px; font-weight:700; color:var(--ink); line-height:1.25; font-family:var(--font-display);}

/* ---------- Product card ---------- */
.pcard{
  background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-m); overflow:hidden;
  display:flex; flex-direction:column; flex:none; width:150px; scroll-snap-align:start;
  position:relative; box-shadow:var(--shadow);
}
.pcard.grid-card{width:auto;}
.pgrid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:26px;}
.pimg{
  height:110px; background:linear-gradient(150deg,#F3F1EA,#EBE8DF);
  display:flex; align-items:center; justify-content:center; position:relative; color:var(--navy-soft);
}
.pimg svg{width:38px; height:38px; opacity:.55;}
.discount-tag{
  position:absolute; top:9px; left:0; background:var(--red); color:#fff;
  font-size:10px; font-weight:800; padding:4px 8px 4px 13px; letter-spacing:.01em;
  clip-path: polygon(9px 0, 100% 0, 100% 100%, 9px 100%, 0 50%);
  box-shadow:0 3px 8px rgba(214,83,74,.35);
}
.discount-tag::after{
  content:""; position:absolute; left:4px; top:50%; width:3px; height:3px;
  transform:translateY(-50%); border-radius:50%; background:rgba(255,255,255,.85);
}
.wish-btn{
  position:absolute; top:6px; right:6px; width:26px; height:26px; border-radius:8px;
  background:rgba(255,255,255,.92); border:none; display:flex; align-items:center; justify-content:center;
  color:var(--ink-faint);
}
.wish-btn svg{width:14px; height:14px;}
.wish-btn.active{color:var(--red);}
.pbody{padding:9px 10px 11px; display:flex; flex-direction:column; gap:4px; flex:1;}
.pname{font-size:12.5px; font-weight:700; line-height:1.3; min-height:32px; font-family:var(--font-display);}
.pcat-label{font-size:9.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; font-weight:700; font-family:var(--font-display);}
.pprice-row{display:flex; align-items:baseline; gap:6px; margin-top:2px; flex-wrap:wrap;}
.pprice{font-size:14px; font-weight:800; color:var(--navy);}
.pprice-old{font-size:10.5px; color:var(--ink-faint); text-decoration:line-through;}
.stars{font-size:9.5px; color:var(--gold-deep); font-weight:700; display:flex; align-items:center; gap:3px; font-family:var(--font-display);}
.stars svg{width:10px; height:10px;}
.add-fab{
  margin-top:6px; width:100%; padding:7px; border-radius:8px; border:none;
  background:var(--navy); color:#fff; font-size:11.5px; font-weight:700;
  display:flex; align-items:center; justify-content:center; gap:5px;
}
.add-fab svg{width:13px; height:13px;}
.add-fab.out{background:var(--border); color:var(--ink-faint);}

/* ---------- Offers strip ---------- */
.offer-strip{
  display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border-soft);
  border-radius:var(--radius-m); padding:12px 14px; margin-bottom:26px; box-shadow:var(--shadow);
}
.offer-strip .oicon{width:36px; height:36px; border-radius:10px; background:#FDF1DE; color:var(--gold-deep); display:flex; align-items:center; justify-content:center; flex:none;}
.offer-strip .oicon svg{width:18px; height:18px;}
.offer-strip strong{font-size:13px; display:block; font-family:var(--font-display);}
.offer-strip span{font-size:11.5px; color:var(--ink-soft);}

/* ---------- WhatsApp FAB ---------- */
.wa-fab{
  position:fixed; right:16px; bottom:calc(var(--nav-h) + var(--nav-buffer) + 14px + env(safe-area-inset-bottom));
  width:52px; height:52px; border-radius:50%; background:var(--green); color:#fff;
  display:flex; align-items:center; justify-content:center; border:none; z-index:45;
  box-shadow:0 8px 20px rgba(47,158,100,.4); transition:opacity .15s ease, transform .15s ease;
}
.wa-fab svg{width:24px; height:24px;}

/* ---------- Bottom nav ---------- */
.bottomnav{
  position:fixed; left:0; right:0; bottom:0; z-index:50;
  height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:var(--surface); border-top:1px solid var(--border);
  box-shadow:0 -6px 20px rgba(20,23,42,.06);
  display:flex; transition:transform .18s ease;
}
body.kb-open .bottomnav{transform:translateY(110%);}
body.kb-open .wa-fab{opacity:0; pointer-events:none;}
body.pd-view .wa-fab{opacity:0; pointer-events:none; transform:scale(.8);}
.nav-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  border:none; background:none; color:var(--ink-faint); font-size:10px; font-weight:700; position:relative;
  transition:color .15s ease;
}
.nav-btn svg{width:21px; height:21px; transition:transform .15s ease;}
.nav-btn.active{color:var(--navy);}
.nav-btn.active svg{transform:translateY(-2px);}
.nav-btn .nb-dot{position:absolute; top:2px; right:calc(50% - 17px); min-width:15px; height:15px; padding:0 3px; border-radius:8px; background:var(--red); color:#fff; font-size:9px; font-weight:800; display:flex; align-items:center; justify-content:center;}

/* ---------- Product detail ---------- */
.pd-gallery{height:230px; border-radius:16px; background:linear-gradient(150deg,#F3F1EA,#EBE8DF); display:flex; align-items:center; justify-content:center; color:var(--navy-soft); margin-bottom:16px; position:relative; overflow:hidden;}
.pd-gallery img, .pimg img, .ci-thumb img{width:100%; height:100%; object-fit:cover;}
.pd-gallery svg{width:64px; height:64px; opacity:.5;}
.pd-title{font-size:19px; margin-bottom:6px;}
.pd-meta{display:flex; align-items:center; gap:10px; font-size:12px; color:var(--ink-soft); margin-bottom:12px; flex-wrap:wrap;}
.pd-price-row{display:flex; align-items:baseline; gap:10px; margin-bottom:4px;}
.pd-price{font-size:25px; font-weight:800; color:var(--navy);}
.pd-old{font-size:14px; color:var(--ink-faint); text-decoration:line-through;}
.pd-save{font-size:11.5px; font-weight:700; color:var(--green); margin-bottom:16px;}
.stock-pill{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:5px 10px; border-radius:20px; margin-bottom:16px; font-family:var(--font-display);}
.stock-pill.in{background:#E7F5EC; color:var(--green);}
.stock-pill.low{background:#FDF1DE; color:var(--gold-deep);}
.stock-pill.out{background:#FBEAE9; color:var(--red);}
.pd-section{margin-bottom:18px;}
.pd-section h4{font-size:13px; margin-bottom:8px; font-weight:800; font-family:var(--font-display);}
.pd-desc{font-size:13.5px; line-height:1.6; color:var(--ink-soft);}
.spec-row{display:flex; justify-content:space-between; font-size:12.5px; padding:8px 0; border-bottom:1px solid var(--border);}
.spec-row span:first-child{color:var(--ink-faint);}
.spec-row span:last-child{font-weight:700; font-family:var(--font-display);}
.review{padding:10px 0; border-bottom:1px solid var(--border);}
.review-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:3px;}
.review-top strong{font-size:12.5px; font-family:var(--font-display);}
.review p{margin:0; font-size:12.5px; color:var(--ink-soft); line-height:1.5;}
.trust-strip{display:flex; gap:8px; margin-bottom:18px;}
.trust-chip{flex:1; text-align:center; background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:10px 4px;}
.trust-chip svg{width:17px; height:17px; color:var(--green); margin-bottom:4px;}
.trust-chip span{display:block; font-size:9.5px; font-weight:700; color:var(--ink-soft); font-family:var(--font-display);}
.pd-actions{
  display:flex; gap:9px; position:fixed; left:0; right:0;
  bottom:calc(var(--nav-h) + env(safe-area-inset-bottom)); z-index:44;
  background:var(--surface); padding:11px 16px; border-top:1px solid var(--border-soft);
  box-shadow:0 -8px 20px rgba(20,23,42,.08); max-width:640px; margin:0 auto;
}
#view-detail{padding-bottom:96px;}
.btn{border:none; border-radius:var(--radius-s); padding:13px; font-size:13.5px; font-weight:800; display:flex; align-items:center; justify-content:center; gap:6px; transition:transform .12s ease, opacity .12s ease;}
.btn:active{transform:scale(.97); opacity:.9;}
.add-fab:active{transform:scale(.96);}
.promo-cta:active{transform:scale(.96);}
.btn svg{width:16px; height:16px;}
.btn-outline{flex:1; background:var(--surface); border:1.5px solid var(--navy); color:var(--navy);}
.btn-primary{flex:1.4; background:var(--navy); color:#fff;}
.btn-gold{background:var(--gold); color:var(--navy-deep);}
.btn-full{width:100%;}
.btn:disabled{opacity:.45;}

/* ---------- Category view ---------- */
.chip-row{display:flex; gap:8px; overflow-x:auto; margin-bottom:16px; padding-bottom:2px;}
.chip-row::-webkit-scrollbar{display:none;}
.chip{flex:none; padding:8px 14px; border-radius:20px; border:1px solid var(--border); background:var(--surface); font-size:12.5px; font-weight:700; color:var(--ink-soft);}
.chip.active{background:var(--navy); border-color:var(--navy); color:#fff;}

/* ---------- Cart ---------- */
.cart-item{display:flex; gap:11px; background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-m); padding:11px; margin-bottom:10px; box-shadow:var(--shadow);}
.ci-thumb{width:58px; height:58px; border-radius:10px; background:#F1EFE8; display:flex; align-items:center; justify-content:center; flex:none; color:var(--navy-soft); overflow:hidden;}
.ci-thumb svg{width:24px; height:24px;}
.ci-body{flex:1; min-width:0;}
.ci-name{font-size:12.5px; font-weight:700; margin-bottom:2px;}
.ci-price{font-size:12px; color:var(--ink-soft); margin-bottom:8px;}
.ci-row{display:flex; align-items:center; justify-content:space-between;}
.qty-stepper{display:flex; align-items:center; gap:0; border:1px solid var(--border); border-radius:9px; overflow:hidden;}
.qty-stepper button{width:28px; height:26px; border:none; background:#F5F3EE; font-weight:800; font-size:14px; color:var(--navy);}
.qty-stepper span{width:26px; text-align:center; font-size:12.5px; font-weight:700;}
.remove-btn{border:none; background:none; color:var(--ink-faint); display:flex; align-items:center; justify-content:center;}
.remove-btn svg{width:16px; height:16px;}
.summary-card{background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-m); padding:14px 16px; margin-top:16px; box-shadow:var(--shadow);}
.sum-row{display:flex; justify-content:space-between; font-size:13px; padding:6px 0; color:var(--ink-soft);}
.sum-row.total{border-top:1px solid var(--border); margin-top:6px; padding-top:12px; font-size:15px; font-weight:800; color:var(--ink);}
.empty-state{text-align:center; padding:50px 20px; color:var(--ink-faint);}
.empty-state svg{width:52px; height:52px; opacity:.4; margin-bottom:14px;}
.empty-state p{font-size:13.5px; margin:0 0 16px;}

/* ---------- Checkout ---------- */
.field{margin-bottom:13px;}
.field label{display:block; font-size:11px; font-weight:800; color:var(--ink-soft); margin-bottom:7px; font-family:var(--font-display); letter-spacing:.04em; text-transform:uppercase;}
.field input, .field select, .field textarea{
  width:100%; padding:11px 12px; border:1.5px solid var(--border); border-radius:var(--radius-s); font-size:13.5px; background:var(--surface); color:var(--ink); outline:none; line-height:1.5;
}
.field textarea{resize:none; min-height:60px; font-family:inherit;}
.field select{appearance:none; background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%235B6072" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>'); background-repeat:no-repeat; background-position:right 12px center; background-size:16px; padding-right:34px;}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--navy); box-shadow:0 0 0 3px rgba(22,34,63,.08);}
.password-wrap{position:relative;}
.password-wrap input{padding-right:42px;}
.pw-toggle{position:absolute; right:4px; top:50%; transform:translateY(-50%); width:34px; height:34px; border:none; background:none; color:var(--ink-faint); display:flex; align-items:center; justify-content:center;}
.pw-toggle svg{width:19px; height:19px;}
.field input::placeholder, .field textarea::placeholder{color:var(--ink-faint); opacity:1; font-weight:400;}
.field-row{display:flex; gap:10px;}
.field-row .field{flex:1;}
.option-card{display:flex; align-items:flex-start; gap:10px; border:1.5px solid var(--border); border-radius:12px; padding:12px; margin-bottom:9px;}
.option-card.selected{border-color:var(--navy); background:#F5F6FA;}
.option-card input{margin-top:2px;}
.option-card strong{font-size:13px; display:block; font-family:var(--font-display);}
.option-card span{font-size:11.5px; color:var(--ink-soft);}
.option-card.disabled{opacity:.5;}
.section-label{font-size:12.5px; font-weight:800; margin:20px 0 10px; display:flex; align-items:center; gap:6px;}

/* ---------- Orders ---------- */
.order-card{background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-m); padding:13px 14px; margin-bottom:11px; box-shadow:var(--shadow);}
.order-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:7px;}
.order-top strong{font-size:13px; font-family:var(--font-display); font-weight:800;}
.order-top time{font-size:11px; color:var(--ink-faint);}
.order-items{margin:6px 0 4px;}
.oi-row{display:flex; align-items:baseline; gap:8px; padding:4px 0; font-size:12.5px;}
.oi-qty{font-family:var(--font-display); font-weight:800; color:var(--navy); flex:none; min-width:24px;}
.oi-name{flex:1; color:var(--ink-soft); font-weight:500;}
.oi-extra{max-height:0; overflow:hidden; transition:max-height .25s ease;}
.oi-extra.open{max-height:320px;}
.oi-toggle{
  display:flex; align-items:center; gap:4px; border:none; background:none;
  color:var(--navy); font-size:11.5px; font-weight:800; padding:4px 0 0; font-family:var(--font-display);
}
.oi-toggle svg{width:12px; height:12px; transition:transform .2s ease;}
.oi-toggle.open svg{transform:rotate(90deg);}
.order-bottom{display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--border); padding-top:9px;}
.status-pill{font-size:10px; font-weight:800; padding:4px 9px; border-radius:20px; text-transform:uppercase; letter-spacing:.03em; font-family:var(--font-display);}
.status-Pending{background:var(--gold-soft); color:var(--gold-deep);}
.status-Confirmed{background:var(--navy-tint); color:var(--navy-soft);}
.status-Processing{background:var(--navy-tint); color:var(--navy);}
.status-Shipped{background:var(--navy); color:#fff;}
.status-Delivered{background:var(--green-soft); color:var(--green);}
.status-Cancelled{background:var(--red-soft); color:var(--red);}
.pay-status{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; color:var(--ink-soft); font-family:var(--font-display);}
.pay-status .dot{width:6px; height:6px; border-radius:50%; flex:none;}
.order-total{font-size:13.5px; font-weight:800;}
.order-card{cursor:pointer;}
.od-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:4px;}
.od-date{font-size:12px; color:var(--ink-faint); margin-bottom:20px;}
.stepper{display:flex; margin-bottom:22px;}
.step{flex:1; text-align:center; position:relative;}
.step::before{content:""; position:absolute; top:7px; left:-50%; width:100%; height:2px; background:var(--border); z-index:0;}
.step:first-child::before{display:none;}
.step.done::before{background:var(--navy);}
.step-dot{width:16px; height:16px; border-radius:50%; background:var(--border); border:2px solid var(--surface); margin:0 auto 6px; position:relative; z-index:1;}
.step.done .step-dot{background:var(--navy);}
.step span{font-size:9.5px; font-weight:700; color:var(--ink-faint); font-family:var(--font-display);}
.step.done span{color:var(--navy);}
.od-items{margin-bottom:2px;}
.od-item-row{display:flex; align-items:center; gap:11px; padding:9px 0; border-bottom:1px solid var(--border-soft);}
.od-item-row:last-child{border-bottom:none;}

/* ---------- Account ---------- */
.acct-card{background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-m); padding:18px; margin-bottom:16px; display:flex; align-items:center; gap:13px; box-shadow:var(--shadow);}
.auth-card{background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-m); padding:20px; box-shadow:var(--shadow); margin-top:8px;}
.acct-avatar{width:48px; height:48px; border-radius:50%; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:17px; flex:none;}
.acct-name{font-size:15px; font-weight:800; font-family:var(--font-display);}
.acct-sub{font-size:11.5px; color:var(--ink-faint); font-family:var(--font-display);}
.menu-list{background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-m); overflow:hidden; margin-bottom:16px; box-shadow:var(--shadow);}
.menu-row{display:flex; align-items:center; gap:12px; padding:14px 15px; border-bottom:1px solid var(--border); font-size:13px; font-weight:600; font-family:var(--font-display);}
.menu-row:last-child{border-bottom:none;}
.menu-row svg{width:18px; height:18px; color:var(--ink-soft); flex:none;}
.menu-row .chev{margin-left:auto; width:14px; height:14px; color:var(--ink-faint);}

/* ---------- Toast / confirmation ---------- */
.toast{
  position:fixed; left:16px; right:16px; bottom:calc(var(--nav-h) + var(--nav-buffer) + 10px + env(safe-area-inset-bottom));
  background:var(--navy-deep); color:#fff; padding:12px 15px; border-radius:12px; font-size:12.5px; font-weight:700; font-family:var(--font-display);
  display:flex; align-items:center; gap:8px; z-index:80; transform:translateY(80px); opacity:0; transition:transform .25s ease, opacity .25s ease; pointer-events:none;
}
.toast.show{transform:translateY(0); opacity:1;}
.toast svg{width:16px; height:16px; color:var(--gold); flex:none;}

.confirm-wrap{text-align:center; padding:30px 10px 10px;}
.confirm-icon{width:74px; height:74px; border-radius:50%; background:#E7F5EC; color:var(--green); display:flex; align-items:center; justify-content:center; margin:0 auto 18px;}
.confirm-icon svg{width:36px; height:36px;}
.confirm-wrap h2{font-size:19px; margin-bottom:8px;}
.confirm-wrap p{font-size:13px; color:var(--ink-soft); margin:0 0 20px;}
.confirm-code{display:inline-block; background:var(--surface); border:1.5px dashed var(--border); border-radius:10px; padding:10px 18px; font-weight:800; font-size:15px; letter-spacing:.04em; color:var(--navy); margin-bottom:24px; font-family:var(--font-display);}

.modal-overlay{position:fixed; inset:0; background:rgba(14,23,48,.5); z-index:90; display:none; align-items:flex-end;}
.modal-overlay.show{display:flex;}
.modal-sheet{background:var(--surface); width:100%; border-radius:18px 18px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom)); max-height:80vh; overflow-y:auto;}
.modal-handle{width:36px; height:4px; border-radius:3px; background:var(--border); margin:0 auto 14px;}
.modal-sheet h3{font-size:15px; margin-bottom:12px;}
</style>
</head>

  wishlist:"Wishlist", cart:"Your Cart", checkout:"Checkout", confirm:"Order placed", orders:"Your Orders", account:"Account", orderdetail:"Order", admin:"Admin dashboard"};
const HOME_HEADER_VIEWS = ["home"];
const BOTTOMNAV_MAP = {home:"home", categories:"categories", cart:"cart", orders:"orders", account:"account"};

let currentView = "home";
let inAppStack = []; // reliable back-stack for the in-app arrow, independent of the browser History API

function syncHeaderOffset(){
  const home = document.getElementById("homeTopbar");
  const head = document.getElementById("pageHead");
  const visible = home.style.display !== "none" ? home : head;
  document.querySelector("main").style.paddingTop = (visible.offsetHeight || 110) + "px";
}

function safeHistory(method, state, hash){
  // Some embedded/in-app webviews (not just full Chrome) restrict history.pushState/replaceState
  // and throw, or silently no-op. Either way the in-app back arrow must not depend on this
  // succeeding, that's what inAppStack above is for. This is only for hardware back/gesture,
  // and its failure is never allowed to break anything else.
  try{ history[method](state, "", hash); return true; } catch(e){ return false; }
}

function goto(view, opts, _isBack){
  opts = opts || {};
  const already = document.getElementById("view-"+view).classList.contains("active");
  if(already && !opts.force){ return; }

  if(!_isBack){
    const titleEl = document.getElementById("pageHeadTitle");
    const prevTitle = HOME_HEADER_VIEWS.includes(currentView) ? "" : (titleEl ? titleEl.textContent : "");
    inAppStack.push({view: currentView, title: prevTitle});
    safeHistory("pushState", {view, title: opts.title || null}, "#"+view);
  }

  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.getElementById("view-"+view).classList.add("active");

  document.getElementById("homeTopbar").style.display = HOME_HEADER_VIEWS.includes(view) ? "" : "none";
  const head = document.getElementById("pageHead");
  if(!HOME_HEADER_VIEWS.includes(view)){
    head.style.display = "flex";
    document.getElementById("pageHeadTitle").textContent = opts.title || TAB_TITLES[view] || "";
  } else {
    head.style.display = "none";
  }
  syncHeaderOffset();

  document.body.classList.toggle("pd-view", view==="detail");

  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
  const tabKey = BOTTOMNAV_MAP[view];
  if(tabKey){
    const btn = document.querySelector(`.nav-btn[data-tab="${tabKey}"]`);
    if(btn) btn.classList.add("active");
  }

  if(view==="categories") renderCategoriesView();
  if(view==="wishlist") renderWishlist();
  if(view==="cart") renderCart();
  if(view==="checkout") renderCheckout();
  if(view==="orders") renderOrders();
  if(view==="account") renderAccount();
  if(view==="admin") renderAdmin();
  if(view==="search"){ setTimeout(()=>document.getElementById("liveSearch").focus(), 50); renderSearch(); }

  currentView = view;
  window.scrollTo(0,0);
}

function goBack(){
  // Deliberately does NOT call history.back(), that's what silently failed before. This works
  // regardless of whether the surrounding browser/webview cooperates with the History API.
  if(inAppStack.length === 0){ goto("home"); return; }
  const prev = inAppStack.pop();
  goto(prev.view, {title: prev.title, force:true}, true);
}

window.addEventListener("popstate", e=>{
  if(e.state && e.state.view){
    goto(e.state.view, {title: e.state.title, force:true}, true);
  } else {
    goto("home", {}, true);
  }
});

/* ---------------- cart ---------------- */
function addToCart(id){
  const p = findProduct(id);
  if(p.qty<=0) return;
  const line = CART.find(l=>l.id===id);
  if(line){
    if(line.qty < p.qty) line.qty++;
    else { toast("No more stock available"); return; }
  } else {
    CART.push({id, qty:1});
  }
  save(); updateBadges();
  toast(`${p.name} added to cart`);
}
function buyNow(id){
  addToCart(id);
  goto("cart");
}
function changeQty(id, delta){
  const line = CART.find(l=>l.id===id);
  if(!line) return;
  const p = findProduct(id);
  line.qty += delta;
  if(line.qty > p.qty) line.qty = p.qty;
  if(line.qty <= 0){ CART = CART.filter(l=>l.id!==id); }
  save(); updateBadges(); renderCart();
}
function removeFromCart(id){
  CART = CART.filter(l=>l.id!==id);
  save(); updateBadges(); renderCart();
  toast("Removed from cart");
}
function cartTotals(){
  let subtotal = 0;
  CART.forEach(l=>{ const p=findProduct(l.id); if(p) subtotal += p.price*l.qty; });
  const delivery = subtotal===0 ? 0 : (subtotal>=FREE_DELIVERY_THRESHOLD ? 0 : DELIVERY_FEE);
  return {subtotal, delivery, total: subtotal+delivery};
}

  }).join("");
  const t = cartTotals();
  document.getElementById("cartSummaryWrap").innerHTML = `
    <div class="summary-card">
      <div class="sum-row"><span>Subtotal</span><span>${naira(t.subtotal)}</span></div>
      <div class="sum-row"><span>Delivery fee</span><span>${t.delivery===0?"Free":naira(t.delivery)}</span></div>

function placeOrder(){
  const name = document.getElementById("coName").value.trim();
  const phone = document.getElementById("coPhone").value.trim();
  const email = document.getElementById("coEmail").value.trim();
  const address = document.getElementById("coAddress").value.trim();
  const state = document.getElementById("coState").value;
  const city = document.getElementById("coCity").value.trim();
  const note = document.getElementById("coNote").value.trim();

  if(!name || !phone || !address || !city){
    toast("Please fill in name, phone, address and city");
    return;
  }
  const t = cartTotals();
  const deliveryFee = selectedDelivery==='express' ? DELIVERY_FEE*2 : t.delivery;
  const order = {
    id: "PPS-" + Date.now().toString().slice(-8),
    date: new Date().toISOString(),
    items: CART.map(l=>{ const p=findProduct(l.id); return {id:p.id, name:p.name, price:p.price, qty:l.qty}; }),
    subtotal: t.subtotal, deliveryFee, total: t.subtotal+deliveryFee,
    delivery: selectedDelivery, payment: selectedPayment,
    customer:{name, phone, email, address, state, city, note},
    status:"Pending", paymentStatus: selectedPayment==='delivery' ? "Due on delivery" : "Awaiting transfer"
  };
  ORDERS.unshift(order);
  LAST_DELIVERY = {name, phone, email, address, state, city};
  CART = [];
  save(); updateBadges();

  // Signed-in customers get their order synced to Firestore so it's visible from any device.
  // Guest checkout stays local-only, same as before, this never blocks placing the order.
  // Uses our own order.id as the doc id (not an auto id) so the admin dashboard can target
  // a specific order directly when updating its status, instead of needing a query.
  if(CURRENT_USER && window.FB){
    window.FB.setDoc(window.FB.doc(window.FB.db, "orders", order.id), {...order, userId: CURRENT_USER.uid})
      .catch(()=>{ /* order still succeeded locally even if the sync failed, e.g. offline */ });
  }

  lastConfirmedOrder = order;
  renderConfirmation(order);
  goto("confirm", {title:"Order placed"});
}
function renderConfirmation(order){
  document.getElementById("view-confirm").innerHTML = `
    <div class="confirm-wrap">
      <div class="confirm-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6 9 17l-5-5"/></svg></div>
      <h2>Order placed successfully</h2>
      <p>We'll confirm shortly on WhatsApp or by phone.</p>
      <div class="confirm-code">${order.id}</div>
      <div class="summary-card" style="text-align:left;">
        <div class="sum-row"><span>Items</span><span>${order.items.reduce((s,i)=>s+i.qty,0)}</span></div>
        <div class="sum-row"><span>Delivery to</span><span>${order.customer.city}, ${order.customer.state}</span></div>
        <div class="sum-row"><span>Payment</span><span>${order.payment==='delivery'?"Pay on delivery":"Bank transfer"}</span></div>
        <div class="sum-row total"><span>Total</span><span>${naira(order.total)}</span></div>

}

function orderItemsHtml(o){
  const visible = o.items.slice(0,3);
  const extra = o.items.slice(3);
  const row = i => `<div class="oi-row"><span class="oi-qty">${i.qty}×</span><span class="oi-name">${i.name}</span></div>`;
  const visibleHtml = visible.map(row).join("");
  if(extra.length===0) return `<div class="order-items">${visibleHtml}</div>`;
  const extraHtml = extra.map(row).join("");
  return `<div class="order-items">
    ${visibleHtml}
    <div class="oi-extra" id="oiExtra-${o.id}">${extraHtml}</div>
    <button class="oi-toggle" id="oiToggle-${o.id}" onclick="event.stopPropagation(); toggleOrderItems('${o.id}', ${extra.length})">
      <span id="oiToggleLabel-${o.id}">+${extra.length} more item${extra.length>1?"s":""}</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </div>`;
}
function toggleOrderItems(orderId, extraCount){
  const extra = document.getElementById("oiExtra-"+orderId);
  const btn = document.getElementById("oiToggle-"+orderId);
  const label = document.getElementById("oiToggleLabel-"+orderId);
  if(!extra || !btn || !label) return;
  const isOpen = extra.classList.toggle("open");
  btn.classList.toggle("open", isOpen);
  label.textContent = isOpen ? "Show less" : `+${extraCount} more item${extraCount>1?"s":""}`;
}

async function renderOrders(){
  if(!CURRENT_USER || !window.FB){
    renderOrdersList(ORDERS); // guest checkout: local cache only, unchanged from before
    return;
  }
  document.getElementById("ordersList").innerHTML = `<div class="empty-state"><p>Loading your orders...</p></div>`;
  try{
    const q = window.FB.query(window.FB.collection(window.FB.db, "orders"), window.FB.where("userId","==",CURRENT_USER.uid));
    const snap = await window.FB.getDocs(q);
    const remote = snap.docs.map(d=>d.data()).sort((a,b)=> new Date(b.date) - new Date(a.date));
    renderOrdersList(remote);
  }catch(e){
    renderOrdersList(ORDERS); // fall back to the local cache if the fetch fails (offline, etc.)
  }
}

function statusStepper(status){
  if(status === "Cancelled"){
    return `<div style="margin-bottom:20px;"><span class="status-pill status-Cancelled">Order cancelled</span></div>`;
  }
  const steps = ["Pending","Confirmed","Processing","Shipped","Delivered"];
  const idx = steps.indexOf(status);
  return `<div class="stepper">${steps.map((s,i)=>`
    <div class="step ${i<=idx?"done":""}"><div class="step-dot"></div><span>${s}</span></div>
  `).join("")}</div>`;
}

function friendlyAuthError(e){
  const map = {
    "auth/email-already-in-use":"That email is already registered. Try logging in instead.",
    "auth/weak-password":"Password should be at least 6 characters.",
    "auth/invalid-email":"That doesn't look like a valid email.",
    "auth/wrong-password":"Incorrect email or password.",
    "auth/invalid-credential":"Incorrect email or password.",
    "auth/user-not-found":"No account found with that email.",
    "auth/network-request-failed":"Network issue, check your connection and try again."
  };
  return map[e && e.code] || "Something went wrong. Please try again.";
}
async function submitLogin(){
  if(!window.FB){ toast("Still connecting, try again in a moment"); return; }
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;
  if(!email || !password){ toast("Enter your email and password"); return; }
  try{
    await window.FB.signInWithEmailAndPassword(window.FB.auth, email, password);
    toast("Welcome back");
  }catch(e){ toast(friendlyAuthError(e)); }
}
async function submitRegister(){
  if(!window.FB){ toast("Still connecting, try again in a moment"); return; }
  const name = document.getElementById("authName").value.trim();
  const phone = document.getElementById("authPhone").value.trim();
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;
  if(!name || !phone || !email || !password){ toast("Please fill in every field"); return; }
  if(password.length < 6){ toast("Password should be at least 6 characters"); return; }
  try{
    const cred = await window.FB.createUserWithEmailAndPassword(window.FB.auth, email, password);
    await window.FB.setDoc(window.FB.doc(window.FB.db, "users", cred.user.uid), {name, phone, email});
    toast("Account created");
  }catch(e){ toast(friendlyAuthError(e)); }
}

  try{ await window.FB.signOut(window.FB.auth); toast("Logged out"); }catch(e){}

      <button class="chip ${adminTab==='orders'?"active":""}" onclick="setAdminTab('orders')">Orders</button>
    </div>
    <div id="adminBody"></div>
  `;
  renderAdminBody();
}
function setAdminTab(tab){ adminTab = tab; renderAdmin(); }
function renderAdminBody(){
  if(adminTab==="products") renderAdminProducts();
  else renderAdminOrders();
}

function renderAdminProducts(){
  document.getElementById("adminBody").innerHTML = `
    <button class="btn btn-primary btn-full" style="padding:13px; margin-bottom:10px;" onclick="openProductForm(null)">+ Add product</button>
    <button class="oi-toggle" style="margin-bottom:14px;" onclick="seedSampleProducts()">
      <span>${PRODUCTS.length ? "Reload" : "Load"} sample catalog into Firestore</span>
    </button>
    ${PRODUCTS.map(p=>`
      <div class="order-card">
        <div class="order-top"><strong>${p.name}</strong><span class="status-pill status-Confirmed">${p.cat}</span></div>
        <div class="order-items"><div class="oi-row"><span class="oi-qty">${naira(p.price)}</span><span class="oi-name">Stock: ${p.qty}</span></div></div>
        <div class="order-bottom">
          <button class="btn btn-outline" style="padding:8px 16px; font-size:12px;" onclick="openProductForm('${p.id}')">Edit</button>
          <button class="btn" style="padding:8px 16px; font-size:12px; background:var(--red-soft); color:var(--red);" onclick="deleteProduct('${p.id}')">Delete</button>
        </div>
      </div>
    `).join("")}
  `;
}
function openProductForm(id){
  const p = id ? PRODUCTS.find(x=>x.id===id) : null;
  document.getElementById("modalSheet").innerHTML = `
    <div class="modal-handle"></div>
    <h3>${p ? "Edit product" : "Add product"}</h3>
    <div class="field"><label>Name</label><input id="pfName" value="${p?p.name:""}" placeholder="e.g. Tecno Spark 20, 128GB"></div>
    <div class="field"><label>Category</label><select id="pfCat">${CATEGORIES.map(c=>`<option ${p&&p.cat===c?"selected":""}>${c}</option>`).join("")}</select></div>
    <div class="field-row">
      <div class="field"><label>Price (₦)</label><input id="pfPrice" type="number" value="${p?p.price:""}"></div>
      <div class="field"><label>Old price (optional)</label><input id="pfOld" type="number" value="${p&&p.old?p.old:""}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Stock qty</label><input id="pfQty" type="number" value="${p?p.qty:""}"></div>
      <div class="field"><label>Image URL (optional)</label><input id="pfImg" value="${p&&p.img?p.img:""}"></div>
    </div>
    <div class="field"><label>Description</label><textarea id="pfDesc" rows="3">${p?p.desc:""}</textarea></div>
    <button class="btn btn-primary btn-full" style="padding:14px;" onclick="saveProduct(${p?`'${p.id}'`:"null"})">Save product</button>
  `;
  openModal();
}
async function saveProduct(id){
  if(!window.FB || !isAdmin()) return;
  const name = document.getElementById("pfName").value.trim();
  const cat = document.getElementById("pfCat").value;
  const price = parseFloat(document.getElementById("pfPrice").value);
  const old = parseFloat(document.getElementById("pfOld").value) || 0;
  const qty = parseInt(document.getElementById("pfQty").value, 10) || 0;
  const img = document.getElementById("pfImg").value.trim();
  const desc = document.getElementById("pfDesc").value.trim();
  if(!name || !cat || !price){ toast("Fill in name, category and price"); return; }
  const docId = id || ("p" + Date.now());
  const existing = id ? PRODUCTS.find(x=>x.id===id) : null;
  const data = {
    id: docId, name, cat, price, old, qty, desc, img: img || null,
    featured: existing ? existing.featured : false,
    hot: existing ? existing.hot : false,
    new: existing ? existing.new : true,
    rating: existing ? existing.rating : 0,
    reviews: existing ? existing.reviews : 0,
    specs: existing ? existing.specs : {}
  };
  try{
    await window.FB.setDoc(window.FB.doc(window.FB.db, "products", docId), data);
    toast(id ? "Product updated" : "Product added");
    closeModal();
    await loadProductsFromFirestore();
    renderAdminProducts();
  }catch(e){ toast("Couldn't save product, try again"); }
}
async function deleteProduct(id){
  if(!window.FB || !isAdmin()) return;
  try{
    await window.FB.deleteDoc(window.FB.doc(window.FB.db, "products", id));
    toast("Product deleted");
    await loadProductsFromFirestore();
    renderAdminProducts();
  }catch(e){ toast("Couldn't delete, try again"); }
}
async function seedSampleProducts(){
  if(!window.FB || !isAdmin()) return;
  try{
    await Promise.all(INITIAL_PRODUCTS.map(p=>window.FB.setDoc(window.FB.doc(window.FB.db, "products", p.id), p)));
    toast("Sample catalog loaded");
    await loadProductsFromFirestore();
    renderAdminProducts();
  }catch(e){ toast("Couldn't load sample catalog, try again"); }
}

async function renderAdminOrders(){
  document.getElementById("adminBody").innerHTML = `<div class="empty-state"><p>Loading orders...</p></div>`;
  try{
    const snap = await window.FB.getDocs(window.FB.collection(window.FB.db, "orders"));
    const all = snap.docs.map(d=>d.data()).sort((a,b)=> new Date(b.date) - new Date(a.date));
    CURRENT_ORDERS_LIST = all; // reused by openOrderDetail() so tapping an order here works too
    const statuses = ["Pending","Confirmed","Processing","Shipped","Delivered","Cancelled"];
    document.getElementById("adminBody").innerHTML = all.length ? all.map(o=>`
      <div class="order-card">
        <div onclick="openOrderDetail('${o.id}')" style="cursor:pointer;">
          <div class="order-top"><strong>${o.id}</strong><span class="status-pill status-${o.status}">${o.status}</span></div>
          <time>${new Date(o.date).toLocaleDateString("en-NG",{day:"numeric",month:"short",year:"numeric"})}</time>
          <div class="order-items"><div class="oi-row"><span class="oi-qty">${naira(o.total)}</span><span class="oi-name">${o.customer.name}, ${o.customer.city}</span></div></div>
        </div>
        <div class="field" style="margin-top:8px; margin-bottom:0;">
          <label>Update status</label>
          <select onchange="updateOrderStatus('${o.id}', this.value)">
            ${statuses.map(s=>`<option ${o.status===s?"selected":""}>${s}</option>`).join("")}
          </select>
        </div>
      </div>
    `).join("") : `<div class="empty-state"><p>No orders yet.</p></div>`;
  }catch(e){
    document.getElementById("adminBody").innerHTML = `<div class="empty-state"><p>Couldn't load orders. Check the Firestore rules are published.</p></div>`;
  }
}
async function updateOrderStatus(orderId, newStatus){
  if(!window.FB || !isAdmin()) return;
  try{
    const updates = {status: newStatus};
    const order = CURRENT_ORDERS_LIST.find(o=>o.id===orderId);
    if(order){
      if(order.payment==="delivery" && newStatus==="Delivered") updates.paymentStatus = "Paid on delivery";
      if(order.payment==="transfer" && ["Confirmed","Processing","Shipped","Delivered"].includes(newStatus)) updates.paymentStatus = "Payment received";
    }
    await window.FB.updateDoc(window.FB.doc(window.FB.db, "orders", orderId), updates);
    toast("Order status updated");
  }catch(e){ toast("Couldn't update status, try again"); }
}

/* ---------------- modal ---------------- */
function openModal(){ document.getElementById("modalOverlay").classList.add("show"); }
function closeModal(){ document.getElementById("modalOverlay").classList.remove("show"); }

/* ---------------- whatsapp ---------------- */
function openWhatsapp(){
  const msg = encodeURIComponent("Hello Parish Priest Stores, I'd like some help with a product.");
  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`, "_blank");
}

/* ---------------- keyboard-safe fixed UI ---------------- */
document.addEventListener("focusin", e=>{
  if(["INPUT","TEXTAREA","SELECT"].includes(e.target.tagName)) document.body.classList.add("kb-open");
});
document.addEventListener("focusout", e=>{
  if(["INPUT","TEXTAREA","SELECT"].includes(e.target.tagName)) setTimeout(()=>{
    const active = document.activeElement;
    if(!active || !["INPUT","TEXTAREA","SELECT"].includes(active.tagName)) document.body.classList.remove("kb-open");
  }, 80);
});

/* ---------------- init ---------------- */
try{
  if("serviceWorker" in navigator){
    window.addEventListener("load", ()=>{
      navigator.serviceWorker.register("service-worker.js").catch(()=>{
        /* fine if this fails, e.g. opened as a local file:// preview instead of hosted on GitHub Pages */
      });
    });
  }
}catch(e){ /* service worker registration is optional, never let it block the app */ }

function initFirebaseAuth(){
  if(!window.FB){ window.addEventListener("fb-ready", initFirebaseAuth, {once:true}); return; }
  window.FB.onAuthStateChanged(window.FB.auth, async user=>{
    CURRENT_USER = user;
    USER_PROFILE = null;
    if(user){
      try{
        const snap = await window.FB.getDoc(window.FB.doc(window.FB.db, "users", user.uid));
        if(snap.exists()) USER_PROFILE = snap.data();
      }catch(e){ /* profile fetch failed, e.g. offline, still signed in, just no cached name yet */ }
    }
    if(document.getElementById("view-account").classList.contains("active")) renderAccount();
    if(document.getElementById("view-orders").classList.contains("active")) renderOrders();
    if(document.getElementById("view-admin").classList.contains("active")) renderAdmin();
  });
}
initFirebaseAuth();

renderHome();
updateBadges();
syncHeaderOffset();
loadProductsFromFirestore();
</script>
</body>
